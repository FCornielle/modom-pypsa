[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modom-pypsa"
version = "0.1.0"
description = "Pipeline para convertir casos MODOM diarios a una capa canonica y luego a PyPSA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pypsa = ["pypsa>=0.28", "pandas>=2.0", "highspy>=1.7"]
dashboard = ["dash>=2.15", "plotly>=5.20", "pandas>=2.0"]
scrape = ["playwright>=1.40", "pdfplumber>=0.11"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

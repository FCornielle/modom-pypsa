<div class="hd"><h3>{{ eq }}</h3><span class="tag">hora {{ sel_hour }}</span></div>
{% if rows %}
  <div class="row cols-2" style="gap:8px 24px;margin-bottom:8px">
  {% for k,v in rows %}<div class="metric-row"><span class="k">{{ k }}</span><b>{{ v }}</b></div>{% endfor %}
  </div>
{% else %}
  <div class="empty-state">Sin datos para este equipo en esta hora.</div>
{% endif %}
{% if series %}
  <h3 style="margin:14px 0 6px">Serie 24 h</h3>
  {{ chart|safe }}
{% endif %}
